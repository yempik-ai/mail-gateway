name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real PostgreSQL for tests/integration/database.migrations.test.ts, which
    # applies every migration and exercises the stores against the schema.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # No version input: pnpm/action-setup reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      # Tests are outside every package's `src`, so they get their own program
      # (tsconfig.tests.json) and their own lint pass.
      - name: Typecheck tests
        run: pnpm typecheck:tests

      - name: Lint
        run: pnpm -r lint

      - name: Lint tests
        run: pnpm lint:tests

      - name: Build
        run: pnpm -r build

      # Boots the built app with require(esm) disabled, as Vercel's function
      # loader does, so a CommonJS dependency that pulls in an ESM-only package
      # fails here instead of in production.
      - name: Boot smoke test
        run: pnpm smoke

      # The whole tests/ tree from the root config, once: the per-package
      # `test` scripts list subsets of it for local runs, and running both
      # here would run those files (PostgreSQL integration included) twice.
      # A test file that no package script lists still runs.
      # DATABASE_URL is scoped to this step: the smoke test must keep booting
      # without a database.
      - name: Test
        run: pnpm exec vitest run
        env:
          DATABASE_URL: postgresql://gateway:gateway@localhost:5432/gateway_test

      - name: Format check
        run: pnpm format:check
