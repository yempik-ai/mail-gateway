name: Feature request
description: Suggest a new capability or a change to an existing one.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        The gateway is draft-first by design. A request that adds arbitrary sending, or any change to received mail, will not be accepted. Other ideas are welcome.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want. For a tool change, give the inputs and outputs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP tools
        - Provider adapter (Gmail, Microsoft 365, Zoho Mail)
        - New provider
        - Admin dashboard
        - Quotas and limits
        - Security
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this.
