services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yempik_mail_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-yempik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yempik_local_password}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - yempik-postgres-data:/var/lib/postgresql/data

volumes:
  yempik-postgres-data:
